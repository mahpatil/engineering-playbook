apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: {{APP_NAME}}
  namespace: {{NAMESPACE}}
spec:
  interval: 5m
  url: "{{GITOPS_REPO_URL}}"
  ref: { branch: "{{BRANCH}}" }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{APP_NAME}}-{{ENVIRONMENT}}
  namespace: {{NAMESPACE}}
spec:
  interval: 5m
  targetNamespace: {{NAMESPACE}}
  chart:
    spec:
      chart: "{{CHART_PATH}}"
      sourceRef: { kind: GitRepository, name: "{{APP_NAME}}", namespace: "{{NAMESPACE}}" }
      valuesFiles: [values.yaml, values-{{ENVIRONMENT}}.yaml]
  install:
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation: { retries: 3 }
  rollback: { enable: true, force: true }
  timeout: 10m
