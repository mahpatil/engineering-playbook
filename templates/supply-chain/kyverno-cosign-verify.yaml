apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-image-signatures-and-provenance
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature-and-provenance
      match:
        any:
          - resources:
              kinds: [Pod, Deployment, Rollout]
              namespaces: ["{{PROTECTED_NAMESPACE}}"]
      verifyImages:
        - imageReferences: ["{{IMAGE_REGISTRY}}/{{GITHUB_ORG}}/*"]
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/{{GITHUB_ORG}}/*
          attestations:
            - predicateType: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: https://github.com/{{GITHUB_ORG}}/*
              conditions:
                - all:
                    - key: "{{ builder.id }}"
                      operator: Equals
                      value: "https://github.com/{{GITHUB_ORG}}/*"
