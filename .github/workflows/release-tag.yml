name: Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto decides patch vs minor by change count)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag:
    name: Create next version tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags
          latest_tag=$(git describe --tags --abbrev=0)
          core=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$core"

          bump="${{ github.event.inputs.bump }}"
          if [ "$bump" = "auto" ]; then
            # Count commits since the last tag to decide patch vs minor
            changes=$(git rev-list "${latest_tag}..HEAD" --count)
            if [ "$changes" -ge 10 ]; then
              bump="minor"
            else
              bump="patch"
            fi
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next_version="v${major}.${minor}.${patch}"
          echo "latest=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "next=$next_version" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"